apply plugin: "com.android.application"

android {
    namespace "app.clipboard.engineprobe"
    compileSdk 36

    defaultConfig {
        applicationId "app.clipboard.engineprobe"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
